<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boom Ops — Pending CS Daily</title>
<style>
  /* ── Portal Chrome (dark) ── */
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #242836; --border: #2e3348;
    --text: #e4e6f0; --text-dim: #8b8fa3; --accent: #6366f1; --purple: #a855f7;
    --green: #22c55e; --red: #ef4444; --blue: #3b82f6;
    --purple-bg: rgba(168,85,247,0.12); --blue-bg: rgba(59,130,246,0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }

  .top-nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .nav-left { display: flex; align-items: center; gap: 10px; }
  .nav-logo { width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent), var(--purple)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: #fff; }
  .nav-title { font-size: 15px; font-weight: 700; }
  .nav-right { display: flex; align-items: center; gap: 10px; }
  .role-badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .role-badge.admin { background: var(--purple-bg); color: var(--purple); }
  .role-badge.viewer { background: var(--blue-bg); color: var(--blue); }
  .nav-user { font-size: 13px; color: var(--text-dim); }
  .logout-btn { padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-size: 12px; cursor: pointer; transition: all 0.2s; text-decoration: none; }
  .logout-btn:hover { border-color: var(--red); color: var(--red); }

  .layout { display: flex; height: calc(100vh - 52px); overflow: hidden; }
  .sidebar { width: 220px; min-width: 220px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: width 0.22s ease, min-width 0.22s ease; flex-shrink: 0; overflow: hidden; }
  .sidebar.collapsed { width: 56px; min-width: 56px; }
  .main-content { flex: 1; overflow-y: auto; }
  .sidebar-toggle { display: flex; align-items: center; justify-content: flex-end; padding: 12px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .sidebar-toggle-btn { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim); font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
  .sidebar-toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sidebar-section { padding: 16px 0 8px; flex-shrink: 0; }
  .sidebar-section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim); padding: 0 16px 8px; white-space: nowrap; overflow: hidden; transition: opacity 0.15s; }
  .sidebar.collapsed .sidebar-section-label { opacity: 0; }
  .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; color: var(--text-dim); text-decoration: none; font-size: 13px; font-weight: 500; transition: all 0.15s; border-left: 3px solid transparent; white-space: nowrap; }
  .sidebar-item:hover { background: var(--surface2); color: var(--text); }
  .sidebar-item.active { background: rgba(99,102,241,0.1); color: var(--accent); border-left-color: var(--accent); }
  .sidebar-item-icon { font-size: 16px; flex-shrink: 0; width: 22px; text-align: center; }
  .sidebar-item-text { overflow: hidden; transition: opacity 0.15s; }
  .sidebar.collapsed .sidebar-item-text { opacity: 0; pointer-events: none; }
  .sidebar.collapsed .sidebar-item { padding: 9px 16px; justify-content: center; }

  /* ── Report (light) ── */
  .report-root {
    --primary:#6366f1;
    --g50:#f9fafb; --g100:#f3f4f6; --g200:#e5e7eb; --g300:#d1d5db; --g400:#9ca3af;
    --g500:#6b7280; --g600:#4b5563; --g700:#374151; --g800:#1f2937; --g900:#111827;
    --r:12px; --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
    background:#f0f0f7; color:var(--g900); font-size:13px; line-height:1.5; min-height:100%;
  }
  .report-root .topbar { background:white; border-bottom:1px solid var(--g200); padding:0 24px; }
  .report-root .topbar-inner { display:flex; align-items:center; justify-content:space-between; height:48px; gap:10px; }
  .report-root .brand { font-size:14px; font-weight:900; letter-spacing:-.3px; }
  .report-root .brand em { color:var(--primary); font-style:normal; }
  .report-root .tb-r { display:flex; align-items:center; gap:8px; }
  .report-root .tb-date { font-size:12px; color:var(--g400); font-weight:500; }
  .report-root .btn { display:inline-flex; align-items:center; gap:5px; padding:6px 13px; border-radius:7px; font-size:11px; font-weight:600; cursor:pointer; border:1px solid var(--g200); background:white; color:var(--g600); font-family:inherit; transition:all .12s; }
  .report-root .btn:hover { background:var(--g50); }
  .report-root .btn.primary { background:var(--primary); color:white; border-color:var(--primary); }
  .report-root .btn.primary:hover { background:#5457e0; }
  .report-root .btn:disabled { opacity:.5; cursor:not-allowed; }

  .report-root .banner { margin:14px 24px 0; padding:10px 14px; border-radius:10px; font-size:12px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .report-root .banner.sample { background:#fffbeb; color:#b45309; border:1px solid #fde68a; }
  .report-root .banner.live { background:#ecfdf5; color:#047857; border:1px solid #6ee7b7; }
  .report-root .banner.err { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }

  .report-root .kpi-strip { display:flex; gap:10px; padding:14px 24px; flex-wrap:wrap; }
  .report-root .kpi { background:white; border:1px solid var(--g200); border-radius:10px; padding:11px 16px; min-width:120px; flex:1; box-shadow:var(--sh); }
  .report-root .kpi-n { font-size:22px; font-weight:800; line-height:1.1; }
  .report-root .kpi-l { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--g400); margin-top:2px; }
  .report-root .kpi-n.red { color:#dc2626; } .report-root .kpi-n.amber { color:#d97706; }
  .report-root .kpi-n.yellow { color:#ca8a04; } .report-root .kpi-n.green { color:#16a34a; }

  .report-root .wrap { padding:6px 24px 40px; }
  .report-root .card { background:white; border:1px solid var(--g200); border-radius:var(--r); overflow:hidden; box-shadow:var(--sh); }
  .report-root table { width:100%; border-collapse:collapse; }
  .report-root thead th { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--g400); text-align:left; padding:10px 16px; background:var(--g50); border-bottom:1px solid var(--g200); white-space:nowrap; }
  .report-root thead th.num, .report-root tbody td.num { text-align:right; }
  .report-root tbody td { padding:12px 16px; border-bottom:1px solid var(--g100); font-size:13px; vertical-align:middle; }
  .report-root tbody tr:last-child td { border-bottom:none; }
  .report-root tbody tr.top { background:linear-gradient(90deg, #fff7ed, #ffffff 60%); }
  .report-root tbody tr.top td:first-child { box-shadow: inset 3px 0 0 #f97316; }
  .report-root .who { display:flex; align-items:center; gap:9px; }
  .report-root .dot { font-size:14px; }
  .report-root .nm { font-weight:700; color:var(--g900); }
  .report-root .login { font-size:11px; color:var(--g400); font-weight:500; }
  .report-root .crown { margin-left:5px; }
  .report-root .tier { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap; }
  .report-root .tier.critical { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
  .report-root .tier.high { background:#fff7ed; color:#c2410c; border:1px solid #fed7aa; }
  .report-root .tier.medium { background:#fefce8; color:#a16207; border:1px solid #fde68a; }
  .report-root .tier.healthy { background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0; }
  .report-root .tkt { font-size:13px; line-height:1.5; }
  .report-root .tkt-link { color:var(--primary); font-weight:700; text-decoration:none; }
  .report-root .tkt-link:hover { text-decoration:underline; }
  .report-root .who-chip { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; background:#eef2ff; color:#4338ca; border:1px solid #e0e7ff; white-space:nowrap; }
  .report-root .who-chip.unmapped { background:var(--g100); color:var(--g500); border-color:var(--g200); }
  .report-root .unassigned-tag { font-size:11px; font-weight:700; color:#a16207; }
  .report-root .big { font-weight:800; font-size:15px; }
  .report-root .age-crit { color:#dc2626; } .report-root .age-high { color:#c2410c; } .report-root .age-med { color:#a16207; } .report-root .age-ok { color:var(--g500); }
  .report-root .unassigned-row td { background:var(--g50); color:var(--g500); font-weight:600; }
  .report-root .legend { display:flex; gap:16px; flex-wrap:wrap; padding:14px 24px 0; font-size:11px; color:var(--g500); font-weight:600; }
  .report-root .legend span { display:inline-flex; align-items:center; gap:5px; }
  .report-root .empty { text-align:center; padding:48px; color:var(--g400); font-weight:600; }
  .report-root .foot-note { font-size:11px; color:var(--g400); padding:12px 24px 0; }
  .report-root .send-status { font-size:12px; font-weight:600; }
  .report-root .send-status.ok { color:#16a34a; } .report-root .send-status.err { color:#dc2626; }
</style>
</head>
<body>

<div class="top-nav">
  <div class="nav-left">
    <div class="nav-logo">B</div>
    <span class="nav-title">Boom Ops</span>
  </div>
  <div class="nav-right">
    <span class="nav-user" id="navUser"></span>
    <span class="role-badge" id="navRole"></span>
    <a href="/logout" class="logout-btn">Sign out</a>
  </div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-toggle">
      <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Toggle sidebar"><span id="sidebarArrow">◀</span></button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">Reports</div>
      <a href="/" class="sidebar-item"><span class="sidebar-item-icon">📊</span><span class="sidebar-item-text">CSM Report</span></a>
      <a href="/migration" class="sidebar-item"><span class="sidebar-item-icon">🔄</span><span class="sidebar-item-text">Migration Daily</span></a>
      <a href="/weekly-report" class="sidebar-item"><span class="sidebar-item-icon">📋</span><span class="sidebar-item-text">Weekly COO Report</span></a>
      <a href="/pending-cs" class="sidebar-item active"><span class="sidebar-item-icon">🎫</span><span class="sidebar-item-text">Pending CS Daily</span></a>
    </div>
  </div>

  <div class="main-content">
  <div class="report-root">
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand">BOOM <em>·</em> Pending CS — Daily Report</div>
        <div class="tb-r">
          <span class="tb-date" id="hdr-date"></span>
          <button class="btn" onclick="load(false)">🧪 Sample</button>
          <button class="btn" id="liveBtn" onclick="load(true)">🔄 Load live (~2 min)</button>
          <button class="btn primary" id="sendBtn" onclick="sendNow()">📣 Send to #boom-ninjas</button>
        </div>
      </div>
    </div>

    <div id="banner"></div>
    <div class="kpi-strip" id="kpi-strip"></div>

    <div class="legend">
      <span>🔴 Critical</span><span>🟠 High</span><span>🟡 Medium</span><span>🟢 Healthy</span>
      <span style="margin-left:auto">👑 = top of the queue</span>
    </div>

    <div class="wrap">
      <div class="card" id="table-card"><div class="empty">Loading…</div></div>
      <div class="foot-note" id="foot"></div>
      <div class="foot-note"><span class="send-status" id="send-status"></span></div>
    </div>
  </div>
  </div>
</div>

<script>
fetch('/api/me').then(r => r.json()).then(me => {
  if (me.error) { window.location.href = '/login'; return }
  document.getElementById('navUser').textContent = me.username
  const roleEl = document.getElementById('navRole')
  roleEl.textContent = me.role === 'admin' ? 'Controller' : 'Viewer'
  roleEl.className = 'role-badge ' + me.role
  window.__isAdmin = me.role === 'admin'
  refreshSendBtn()
}).catch(() => { window.location.href = '/login' })

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar'), arrow = document.getElementById('sidebarArrow')
  const collapsed = sidebar.classList.toggle('collapsed')
  arrow.textContent = collapsed ? '▶' : '◀'
  localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0')
}
if (localStorage.getItem('sidebarCollapsed') === '1') {
  document.getElementById('sidebar').classList.add('collapsed')
  document.getElementById('sidebarArrow').textContent = '▶'
}

document.getElementById('hdr-date').textContent =
  new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' })

var STATE = { meta: null }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function ageCls(d){ return d >= 7 ? 'age-crit' : d >= 4 ? 'age-high' : d >= 2 ? 'age-med' : 'age-ok' }
var DOTS = { critical:'🔴', high:'🟠', medium:'🟡', healthy:'🟢' }

function refreshSendBtn() {
  const btn = document.getElementById('sendBtn')
  if (!btn) return
  const canSend = window.__isAdmin && STATE.meta && STATE.meta.githubConfigured && STATE.meta.slackConfigured
  btn.disabled = !canSend
  if (!window.__isAdmin) btn.title = 'Controller (admin) role required'
  else if (!STATE.meta) btn.title = ''
  else if (!STATE.meta.githubConfigured) btn.title = 'GitHub not configured on the server'
  else if (!STATE.meta.slackConfigured) btn.title = 'Slack not configured on the server'
  else btn.title = 'Post the live report to Slack now'
}

function load(live) {
  const liveBtn = document.getElementById('liveBtn')
  document.getElementById('table-card').innerHTML =
    '<div class="empty">' + (live ? 'Scanning the DEV Team planning board… this takes up to ~2 minutes.' : 'Loading…') + '</div>'
  if (live && liveBtn) { liveBtn.disabled = true; liveBtn.textContent = '⏳ Loading live…' }
  fetch('/api/pending-cs' + (live ? '?live=1' : '')).then(r => r.json()).then(render).catch(e => {
    document.getElementById('table-card').innerHTML = '<div class="empty">Failed to load: ' + esc(e.message) + '</div>'
  }).finally(() => {
    if (liveBtn) { liveBtn.disabled = false; liveBtn.textContent = '🔄 Load live (~2 min)' }
  })
}

function render(data) {
  STATE.meta = data
  refreshSendBtn()
  const rep = data.report

  // Banner
  const banner = document.getElementById('banner')
  if (data.error) {
    banner.innerHTML = '<div class="banner err">⚠️ Live fetch failed (' + esc(data.error) + '). Showing sample data.</div>'
  } else if (data.sample) {
    banner.innerHTML = '<div class="banner sample">🧪 Sample preview — set <code>GITHUB_TOKEN</code> &amp; <code>GITHUB_PROJECT_NUMBER</code> on the server to show live Pending CS tickets.'
      + (data.scheduleEnabled ? '' : ' Scheduler is currently idle.') + '</div>'
  } else {
    banner.innerHTML = '<div class="banner live">🟢 Live data from <b>' + esc(rep.repo) + '</b> · label "' + esc(rep.label) + '"'
      + (data.scheduleEnabled ? ' · auto-posts ' + esc(data.schedule) + ' (' + esc(data.tz) + ')' : ' · scheduler idle') + '</div>'
  }

  // KPIs
  const c = rep.counts
  document.getElementById('kpi-strip').innerHTML =
    kpi(rep.totalTickets, 'Open Tickets', '') +
    kpi(c.critical, 'Critical', 'red') +
    kpi(c.high, 'High', 'amber') +
    kpi(rep.unassignedCount, 'Unassigned', rep.unassignedCount ? 'yellow' : '')

  // Per-ticket table
  const card = document.getElementById('table-card')
  if (!rep.totalTickets) {
    card.innerHTML = '<div class="empty">🎉 Queue is clear — no open Pending CS tickets.</div>'
  } else {
    let html = '<table><thead><tr>'
      + '<th>#</th><th>Ticket</th><th>Assignee</th><th>Status</th><th class="num">Age</th>'
      + '</tr></thead><tbody>'
    for (const tk of rep.tickets) {
      const titleCell = (tk.url
        ? '<a href="' + esc(tk.url) + '" target="_blank" class="tkt-link">#' + tk.number + ' ' + esc(tk.title) + '</a>'
        : '#' + tk.number + ' ' + esc(tk.title))
      const who = tk.unassigned
        ? '<span class="unassigned-tag">❔ unassigned</span>'
        : tk.assignees.map(a => '<span class="who-chip' + (a.slackId ? '' : ' unmapped') + '">' + esc(a.name) + '</span>').join(' ')
      html += '<tr class="' + (tk.top ? 'top' : '') + (tk.unassigned ? ' unassigned-row' : '') + '">'
        + '<td class="num" style="color:var(--g400);font-weight:700">' + tk.rank + '</td>'
        + '<td><div class="tkt">' + DOTS[tk.tier] + ' ' + titleCell + (tk.top ? '<span class="crown">👑</span>' : '')
          + (tk.repo ? '<br><span class="login">' + esc(tk.repo) + '</span>' : '') + '</div></td>'
        + '<td>' + who + '</td>'
        + '<td><span class="tier ' + tk.tier + '">' + DOTS[tk.tier] + ' ' + esc(tk.tierLabel) + '</span></td>'
        + '<td class="num"><span class="big ' + ageCls(tk.ageDays) + '">' + tk.ageDays + 'd</span></td>'
        + '</tr>'
    }
    html += '</tbody></table>'
    card.innerHTML = html
  }

  document.getElementById('foot').textContent =
    'Generated ' + new Date(rep.generatedAt).toLocaleString('en-US')
    + ' · posts to channel ' + esc(data.channel)
    + ' · Slack ' + (data.slackConfigured ? 'configured' : 'not configured')
}

function kpi(n, l, cls) {
  return '<div class="kpi"><div class="kpi-n ' + cls + '">' + n + '</div><div class="kpi-l">' + l + '</div></div>'
}

function sendNow() {
  const s = document.getElementById('send-status')
  const btn = document.getElementById('sendBtn')
  if (!confirm('Post the live Pending CS report to Slack now?')) return
  btn.disabled = true
  s.className = 'send-status'; s.textContent = 'Sending…'
  fetch('/api/pending-cs/send', { method: 'POST' }).then(r => r.json()).then(d => {
    if (d.success) {
      s.className = 'send-status ok'
      s.textContent = '✓ Posted to Slack via ' + d.via + ' — ' + d.totalTickets + ' tickets (' + d.unassignedCount + ' unassigned).'
    } else {
      s.className = 'send-status err'; s.textContent = '✗ ' + (d.error || 'Failed to send.')
    }
  }).catch(e => { s.className = 'send-status err'; s.textContent = '✗ ' + e.message })
    .finally(() => { refreshSendBtn() })
}

load(false)
</script>
</body>
</html>
